<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool Drill Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --chalk: #e8e4d4; --chalk-muted: #b8b49e;
    --accent: #f5c518; --accent-dim: rgba(245,197,24,0.15);
    --danger: #e05252; --success: #52c07a;
    --card-bg: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.08);
  }
  body {
    background-color: #0f1f17; color: var(--chalk);
    font-family: 'DM Sans', sans-serif; min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(26,58,42,0.8) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  }
  .container { max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3rem; letter-spacing: 0.04em; color: var(--accent); line-height: 1; }
  .subtitle { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--chalk-muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .card-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--chalk-muted); margin-bottom: 1.25rem; }
  .field { margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--chalk-muted); margin-bottom: 0.4rem; letter-spacing: 0.04em; }

  /* Game selector — 2-column grid */
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  .game-tab {
    padding: 0.45rem 0.25rem; border-radius: 8px; border: 1px solid var(--border);
    background: none; color: var(--chalk-muted); font-family: 'DM Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.04em; cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.3;
  }
  .game-tab:hover { border-color: rgba(245,197,24,0.4); color: var(--chalk); }
  .game-tab.active { background: var(--accent-dim); border-color: rgba(245,197,24,0.5); color: var(--accent); }

  .number-input {
    display: flex; align-items: center; background: rgba(0,0,0,0.3);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; width: 100%;
  }
  .number-input button {
    background: none; border: none; color: var(--chalk-muted); font-size: 1.2rem;
    width: 40px; height: 44px; cursor: pointer; transition: background 0.15s, color 0.15s;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .number-input button:hover { background: rgba(255,255,255,0.08); color: var(--chalk); }
  .number-input input {
    background: none; border: none; color: var(--chalk); font-family: 'DM Mono', monospace;
    font-size: 1.1rem; font-weight: 500; text-align: center; width: 100%; outline: none; -moz-appearance: textfield;
  }
  .number-input input::-webkit-outer-spin-button,
  .number-input input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* hide break field for absolute games */
  .break-field { transition: opacity 0.2s; }
  .break-field.hidden { opacity: 0; pointer-events: none; height: 0; margin: 0; overflow: hidden; }

  .score-preview {
    background: var(--accent-dim); border: 1px solid rgba(245,197,24,0.3);
    border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .score-preview .label { font-size: 0.75rem; color: rgba(245,197,24,0.7); font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
  .score-preview .value { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--accent); line-height: 1; }
  .score-preview .value.invalid { color: var(--chalk-muted); font-size: 1rem; font-family: 'DM Sans', sans-serif; font-weight: 300; }

  .btn-add {
    width: 100%; background: var(--accent); color: #1a1200; border: none; border-radius: 8px;
    height: 48px; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.1em;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .btn-add:hover { background: #ffd633; }
  .btn-add:active { transform: scale(0.98); }
  .btn-add:disabled { background: rgba(245,197,24,0.2); color: rgba(245,197,24,0.4); cursor: not-allowed; transform: none; }

  .right-col { display: flex; flex-direction: column; gap: 1.25rem; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
  .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; text-align: center; }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-muted); margin-bottom: 0.3rem; }
  .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--chalk); line-height: 1; }
  .stat-value.highlight { color: var(--accent); }

  .chart-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem 1rem; }
  .chart-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.75rem; gap: 0.5rem; }
  .chart-wrap { position: relative; height: 200px; }
  .chart-filter { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: flex-end; max-width: 55%; }
  .chart-tab {
    padding: 0.18rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);
    background: none; color: var(--chalk-muted); font-family: 'DM Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.04em; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .chart-tab:hover { border-color: rgba(245,197,24,0.4); color: var(--chalk); }
  .chart-tab.active { background: var(--accent-dim); border-color: rgba(245,197,24,0.4); color: var(--accent); }

  /* History */
  .history-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .history-header { padding: 1rem 1.25rem 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .btn-clear { background: none; border: 1px solid rgba(224,82,82,0.3); color: var(--danger); border-radius: 6px; padding: 0.25rem 0.75rem; font-size: 0.72rem; font-family: 'DM Mono', monospace; letter-spacing: 0.08em; cursor: pointer; transition: background 0.15s; }
  .btn-clear:hover { background: rgba(224,82,82,0.1); }
  .btn-export { background: none; border: 1px solid rgba(82,192,122,0.3); color: var(--success); border-radius: 6px; padding: 0.25rem 0.75rem; font-size: 0.72rem; font-family: 'DM Mono', monospace; letter-spacing: 0.08em; cursor: pointer; transition: background 0.15s; }
  .btn-export:hover { background: rgba(82,192,122,0.1); }

  .history-empty { padding: 2rem; text-align: center; color: var(--chalk-muted); font-size: 0.85rem; }
  .history-list { max-height: 300px; overflow-y: auto; }

  /* Columns: # | Game | Pocketed | Break | Score | Date | × */
  .history-cols, .history-row {
    display: grid;
    grid-template-columns: 2rem 1fr 3rem 3rem 3.5rem 5rem 1.8rem;
    align-items: center;
    padding: 0.65rem 1.25rem;
    gap: 0.5rem;
  }
  .history-cols { padding: 0.5rem 1.25rem; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
  .history-row { border-bottom: 1px solid var(--border); font-size: 0.82rem; transition: background 0.1s; animation: rowIn 0.3s ease; }
  .history-row:hover { background: rgba(255,255,255,0.03); }
  .history-row:last-child { border-bottom: none; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  .rack-num { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--chalk-muted); }
  .cell { color: var(--chalk); font-family: 'DM Mono', monospace; font-size: 0.8rem; }
  .cell-muted { color: var(--chalk-muted); font-family: 'DM Mono', monospace; font-size: 0.8rem; }

  .game-badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 0.62rem; font-weight: 500; line-height: 1.4; }
  .gb-9    { background: rgba(245,197,24,0.12);  color: rgba(245,197,24,0.85); }
  .gb-8    { background: rgba(82,192,122,0.12);  color: rgba(82,192,122,0.85); }
  .gb-abs  { background: rgba(180,140,255,0.12); color: rgba(180,140,255,0.85); }

  .score-pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; }
  .score-high { background: rgba(82,192,122,0.15); color: var(--success); }
  .score-mid  { background: rgba(245,197,24,0.15); color: var(--accent); }
  .score-low  { background: rgba(224,82,82,0.15); color: var(--danger); }
  .score-abs  { background: rgba(180,140,255,0.15); color: rgba(180,140,255,0.9); }

  .col-head { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--chalk-muted); }
  .btn-delete { background: none; border: none; color: rgba(224,82,82,0.35); cursor: pointer; padding: 0; font-size: 1rem; line-height: 1; transition: color 0.15s; display: flex; align-items: center; justify-content: center; }
  .btn-delete:hover { color: var(--danger); }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Pool Drills</h1>
    <span class="subtitle">Progress Tracker</span>
  </header>

  <div class="layout">
    <!-- Entry Form -->
    <div class="card">
      <div class="card-title">Log a Drill</div>

      <div class="field">
        <label>Game</label>
        <div class="game-grid" id="game-grid"></div>
      </div>

      <div class="field break-field" id="break-field">
        <label>Balls pocketed on break</label>
        <div class="number-input">
          <button onclick="adj('break',-1)">−</button>
          <input type="number" id="inp-break" value="0" min="0" max="9" oninput="updatePreview()">
          <button onclick="adj('break',1)">+</button>
        </div>
      </div>

      <div class="field">
        <label id="pocketed-label">Balls pocketed</label>
        <div class="number-input">
          <button onclick="adj('pocketed',-1)">−</button>
          <input type="number" id="inp-pocketed" value="0" min="0" oninput="updatePreview()">
          <button onclick="adj('pocketed',1)">+</button>
        </div>
      </div>

      <div class="score-preview">
        <div>
          <div class="label" id="preview-score-label">Score</div>
          <div class="value invalid" id="score-display">—</div>
        </div>
        <div style="text-align:right" id="preview-right">
          <div class="label">Clearance</div>
          <div style="font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--chalk-muted)" id="clearance-display">—</div>
        </div>
      </div>

      <button class="btn-add" id="btn-log" onclick="logRack()">Log Drill</button>
    </div>

    <!-- Right column -->
    <div class="right-col">
      <div class="chart-card">
        <div class="chart-header">
          <div class="card-title" style="margin:0">Score over time</div>
          <div class="chart-filter" id="chart-filter"></div>
        </div>
        <div class="chart-wrap"><canvas id="scoreChart"></canvas></div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-label" id="stat-racks-label">Drills</div>
          <div class="stat-value highlight" id="stat-racks">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Score</div>
          <div class="stat-value" id="stat-avg">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best</div>
          <div class="stat-value" id="stat-best">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div style="margin-top:1.5rem">
    <div class="history-card">
      <div class="history-header">
        <div class="card-title" style="margin:0">History</div>
        <div style="display:flex;gap:0.5rem">
          <button class="btn-export" onclick="exportCSV()">Export CSV</button>
          <button class="btn-clear" onclick="clearHistory()">Clear All</button>
        </div>
      </div>
      <div class="history-cols">
        <span class="col-head">#</span>
        <span class="col-head">Game</span>
        <span class="col-head">Pocketed</span>
        <span class="col-head">Break</span>
        <span class="col-head">Score</span>
        <span class="col-head">Date</span>
        <span></span>
      </div>
      <div id="history-empty" class="history-empty">No drills logged yet.</div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'pool-drill-tracker-v1';
  let racks = [];
  let chart = null;
  let selectedGame = '9ball';
  let chartFilter = 'all';

  // type: 'ghost' = percentage scoring (9/8-ball); 'absolute' = raw ball count
  const GAMES = {
    '9ball':   { label: '9-Ball Ghost',         shortLabel: '9-Ball',    type: 'ghost',    balls: 9,  badgeClass: 'gb-9' },
    '8ball':   { label: '8-Ball Ghost',         shortLabel: '8-Ball',    type: 'ghost',    balls: 8,  badgeClass: 'gb-8' },
    'spot':    { label: 'Spot to Spot',         shortLabel: 'S→S',       type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
    '2ball':   { label: '2-Ball Positioning',   shortLabel: '2-Ball Pos',type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
    'bt15':    { label: 'Brain Teaser (15 box)', shortLabel: 'BT 15box', type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
    'bt1':     { label: 'Brain Teaser (1 ctr)', shortLabel: 'BT 1ctr',  type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
    'mightyx': { label: 'Mighty X',             shortLabel: 'Mighty X',  type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
    '4rails':  { label: '4 Balls Around Rails', shortLabel: '4 Rails',   type: 'absolute', balls: 99, badgeClass: 'gb-abs' },
  };

  // Build game selector tabs
  function buildGameTabs() {
    const grid = document.getElementById('game-grid');
    grid.innerHTML = Object.entries(GAMES).map(([key, g]) =>
      `<button class="game-tab${key === selectedGame ? ' active' : ''}" id="tab-${key}" onclick="selectGame('${key}')">${g.label}</button>`
    ).join('');
  }

  // Build chart filter tabs
  function buildChartFilter() {
    const cf = document.getElementById('chart-filter');
    const tabs = [{ key: 'all', label: 'All' }, ...Object.entries(GAMES).map(([k, g]) => ({ key: k, label: g.shortLabel }))];
    cf.innerHTML = tabs.map(t =>
      `<button class="chart-tab${t.key === chartFilter ? ' active' : ''}" id="ctab-${t.key}" onclick="setChartFilter('${t.key}')">${t.label}</button>`
    ).join('');
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) racks = JSON.parse(raw);
      // migrate old records
      racks = racks.map(r => {
        if (!r.game) r.game = '9ball';
        // old records stored misses; convert to pocketed for ghost games
        if (r.misses !== undefined && r.pocketed === undefined) {
          const total = GAMES[r.game]?.balls || 9;
          r.pocketed = total - r.brk - r.misses;
          delete r.misses;
        }
        return r;
      });
    } catch(e) { racks = []; }
    buildGameTabs();
    buildChartFilter();
    updateFormUI();
    render();
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(racks)); }

  function isGhost(game) { return GAMES[game]?.type === 'ghost'; }

  function selectGame(game) {
    selectedGame = game;
    document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + game).classList.add('active');
    document.getElementById('inp-break').value = 0;
    document.getElementById('inp-pocketed').value = 0;
    updateFormUI();
    updatePreview();
  }

  function updateFormUI() {
    const ghost = isGhost(selectedGame);
    const breakField = document.getElementById('break-field');
    const pocketedLabel = document.getElementById('pocketed-label');
    const previewRight = document.getElementById('preview-right');
    breakField.classList.toggle('hidden', !ghost);
    pocketedLabel.textContent = ghost ? 'Misses' : 'Balls pocketed';
    previewRight.style.display = ghost ? '' : 'none';
  }

  function setChartFilter(filter) {
    chartFilter = filter;
    document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('ctab-' + filter).classList.add('active');
    if (chart) { chart.destroy(); chart = null; }
    render();
  }

  function adj(field, delta) {
    const id = field === 'break' ? 'inp-break' : 'inp-pocketed';
    const el = document.getElementById(id);
    const max = field === 'break' ? (GAMES[selectedGame]?.balls || 9) : 999;
    const v = Math.max(0, Math.min(max, (parseInt(el.value) || 0) + delta));
    el.value = v;
    updatePreview();
  }

  // For ghost: pocketed input = misses; score = 100*(left-misses)/left
  // For absolute: pocketed input = balls pocketed; score = pocketed
  function calcScore(game, brk, pocketed) {
    if (isGhost(game)) {
      const total = GAMES[game].balls;
      const left = total - brk;
      if (left <= 0) return null;
      if (pocketed > left) return null; // misses > balls remaining
      return Math.round(100 * (left - pocketed) / left);
    } else {
      return pocketed; // absolute
    }
  }

  // Pocketed column value for display
  function getPocketedDisplay(r) {
    if (isGhost(r.game)) {
      const total = GAMES[r.game]?.balls || 9;
      return total - r.brk - r.pocketed; // balls actually potted after break
    }
    return r.pocketed;
  }

  function updatePreview() {
    const brk = parseInt(document.getElementById('inp-break').value) || 0;
    const pocketed = parseInt(document.getElementById('inp-pocketed').value) || 0;
    const ghost = isGhost(selectedGame);
    const score = calcScore(selectedGame, brk, pocketed);
    const scoreEl = document.getElementById('score-display');
    const clearEl = document.getElementById('clearance-display');
    const btn = document.getElementById('btn-log');

    if (score === null) {
      scoreEl.textContent = '—'; scoreEl.className = 'value invalid';
      clearEl.textContent = '—'; btn.disabled = true;
    } else {
      scoreEl.textContent = score; scoreEl.className = 'value';
      if (ghost) {
        const total = GAMES[selectedGame].balls;
        const left = total - brk;
        clearEl.textContent = `${left - pocketed} / ${left} balls`;
      }
      btn.disabled = false;
    }
  }

  function logRack() {
    const brk = parseInt(document.getElementById('inp-break').value) || 0;
    const pocketed = parseInt(document.getElementById('inp-pocketed').value) || 0;
    const score = calcScore(selectedGame, brk, pocketed);
    if (score === null) return;
    racks.push({ game: selectedGame, brk, pocketed, score, ts: Date.now() });
    save();
    document.getElementById('inp-break').value = 0;
    document.getElementById('inp-pocketed').value = 0;
    updatePreview();
    render();
  }

  function exportCSV() {
    if (!racks.length) return;
    const rows = [['#','Game','Pocketed','Break','Score','Date']];
    racks.forEach((r, i) => {
      rows.push([i+1, GAMES[r.game]?.label || r.game, getPocketedDisplay(r), isGhost(r.game) ? r.brk : '—', r.score, new Date(r.ts).toLocaleDateString()]);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'pool-drills.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function deleteRack(index) {
    racks.splice(index, 1); save();
    if (chart) { chart.destroy(); chart = null; }
    render();
  }

  function clearHistory() {
    if (!racks.length) return;
    if (!confirm('Clear all history?')) return;
    racks = []; save();
    if (chart) { chart.destroy(); chart = null; }
    render();
  }

  function scoreClass(r) {
    if (isGhost(r.game)) {
      if (r.score >= 80) return 'score-high';
      if (r.score >= 50) return 'score-mid';
      return 'score-low';
    }
    return 'score-abs';
  }

  function render() {
    // Stats filtered to match chart filter
    const statData = chartFilter === 'all' ? racks : racks.filter(r => r.game === chartFilter);
    const filterLabel = chartFilter === 'all' ? '' : ` (${GAMES[chartFilter]?.shortLabel || chartFilter})`;
    document.getElementById('stat-racks-label').textContent = 'Drills' + filterLabel;
    document.getElementById('stat-racks').textContent = statData.length;
    if (statData.length) {
      const avg = Math.round(statData.reduce((a,r) => a + r.score, 0) / statData.length);
      const best = Math.max(...statData.map(r => r.score));
      document.getElementById('stat-avg').textContent = avg;
      document.getElementById('stat-best').textContent = best;
    } else {
      document.getElementById('stat-avg').textContent = '—';
      document.getElementById('stat-best').textContent = '—';
    }

    const emptyEl = document.getElementById('history-empty');
    const listEl = document.getElementById('history-list');
    if (!racks.length) {
      emptyEl.style.display = ''; listEl.innerHTML = '';
    } else {
      emptyEl.style.display = 'none';
      listEl.innerHTML = [...racks].reverse().map((r, i) => {
        const actualIndex = racks.length - 1 - i;
        const num = racks.length - i;
        const g = GAMES[r.game] || GAMES['9ball'];
        const badgeClass = g.badgeClass;
        const pocketedVal = getPocketedDisplay(r);
        const breakVal = isGhost(r.game) ? r.brk : '—';
        const dateVal = new Date(r.ts).toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' });
        return `<div class="history-row">
          <span class="rack-num">${num}</span>
          <span><span class="game-badge ${badgeClass}">${g.shortLabel}</span></span>
          <span class="cell">${pocketedVal}</span>
          <span class="${isGhost(r.game) ? 'cell' : 'cell-muted'}">${breakVal}</span>
          <span><span class="score-pill ${scoreClass(r)}">${r.score}</span></span>
          <span class="cell-muted" style="font-size:0.72rem">${dateVal}</span>
          <button class="btn-delete" onclick="deleteRack(${actualIndex})" aria-label="Delete #${num}">×</button>
        </div>`;
      }).join('');
    }
    renderChart();
  }

  function renderChart() {
    const filtered = chartFilter === 'all' ? racks : racks.filter(r => r.game === chartFilter);
    const ctx = document.getElementById('scoreChart').getContext('2d');
    const labels = filtered.map((_, i) => i + 1);
    const data = filtered.map(r => r.score);
    const rolling = data.map((_, i) => {
      const w = data.slice(Math.max(0, i-4), i+1);
      return Math.round(w.reduce((a,b) => a+b, 0) / w.length);
    });

    // color by filter
    const colorMap = {
      '9ball':   { line: 'rgba(245,197,24,0.5)',  fill: 'rgba(245,197,24,0.08)',  point: 'rgba(245,197,24,0.9)' },
      '8ball':   { line: 'rgba(82,192,122,0.5)',  fill: 'rgba(82,192,122,0.08)',  point: 'rgba(82,192,122,0.9)' },
      'default': { line: 'rgba(180,140,255,0.5)', fill: 'rgba(180,140,255,0.08)', point: 'rgba(180,140,255,0.9)' },
    };
    const c = colorMap[chartFilter] || colorMap['default'];
    const yMax = (chartFilter !== 'all' && GAMES[chartFilter]?.type === 'absolute') ? undefined : 100;

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.data.datasets[0].borderColor = c.line;
      chart.data.datasets[0].backgroundColor = c.fill;
      chart.data.datasets[0].pointBackgroundColor = c.point;
      chart.data.datasets[1].data = rolling;
      chart.options.scales.y.max = yMax;
      chart.update('none');
      return;
    }

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Score', data, borderColor: c.line, backgroundColor: c.fill, pointBackgroundColor: c.point, pointRadius: 4, pointHoverRadius: 6, borderWidth: 1.5, fill: true, tension: 0.3 },
          { label: 'Avg (5)', data: rolling, borderColor: 'rgba(255,255,255,0.3)', backgroundColor: 'transparent', pointRadius: 0, borderWidth: 2, tension: 0.4, fill: false }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: 'rgba(184,180,158,0.8)', font: { family: 'DM Mono', size: 10 }, boxWidth: 16, padding: 12 } },
          tooltip: { backgroundColor: 'rgba(15,31,23,0.95)', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1, titleColor: '#e8e4d4', bodyColor: '#b8b49e', titleFont: { family: 'DM Mono', size: 11 }, bodyFont: { family: 'DM Mono', size: 11 } }
        },
        scales: {
          x: { ticks: { color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: 'rgba(255,255,255,0.1)' }, title: { display: true, text: 'Drill #', color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 } } },
          y: { min: 0, max: yMax, ticks: { color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: 'rgba(255,255,255,0.1)' } }
        }
      }
    });
  }

  load();
  updatePreview();
</script>
</body>
</html>
