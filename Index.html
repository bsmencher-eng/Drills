<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9-Ball Drill Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --felt: #1a3a2a;
    --felt-light: #224433;
    --rail: #6b3a1f;
    --chalk: #e8e4d4;
    --chalk-muted: #b8b49e;
    --cue-ball: #f5f0e8;
    --nine-ball: #f5c518;
    --accent: #f5c518;
    --accent-dim: rgba(245,197,24,0.15);
    --danger: #e05252;
    --success: #52c07a;
    --card-bg: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }

  body {
    background-color: #0f1f17;
    color: var(--chalk);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(26,58,42,0.8) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 0.04em;
    color: var(--accent);
    line-height: 1;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--chalk-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 680px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* Entry Form */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--chalk-muted);
    margin-bottom: 1.25rem;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--chalk-muted);
    margin-bottom: 0.4rem;
    letter-spacing: 0.04em;
  }

  .number-input {
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
  }

  .number-input button {
    background: none;
    border: none;
    color: var(--chalk-muted);
    font-size: 1.2rem;
    width: 40px;
    height: 44px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  .number-input button:hover { background: rgba(255,255,255,0.08); color: var(--chalk); }

  .number-input input {
    background: none;
    border: none;
    color: var(--chalk);
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    text-align: center;
    width: 100%;
    outline: none;
    -moz-appearance: textfield;
  }
  .number-input input::-webkit-outer-spin-button,
  .number-input input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Score preview */
  .score-preview {
    background: var(--accent-dim);
    border: 1px solid rgba(245,197,24,0.3);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .score-preview .label {
    font-size: 0.75rem;
    color: rgba(245,197,24,0.7);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .score-preview .value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    color: var(--accent);
    line-height: 1;
  }

  .score-preview .value.invalid {
    color: var(--chalk-muted);
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  .btn-add {
    width: 100%;
    background: var(--accent);
    color: #1a1200;
    border: none;
    border-radius: 8px;
    height: 48px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-add:hover { background: #ffd633; }
  .btn-add:active { transform: scale(0.98); }
  .btn-add:disabled { background: rgba(245,197,24,0.2); color: rgba(245,197,24,0.4); cursor: not-allowed; transform: none; }

  /* Stats + Chart */
  .right-col { display: flex; flex-direction: column; gap: 1.25rem; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }

  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    text-align: center;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--chalk-muted);
    margin-bottom: 0.3rem;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--chalk);
    line-height: 1;
  }

  .stat-value.highlight { color: var(--accent); }

  .chart-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.5rem 1rem;
    position: relative;
  }

  .chart-wrap { position: relative; height: 200px; }

  /* History */
  .history-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .history-header {
    padding: 1rem 1.25rem 0.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .btn-clear {
    background: none;
    border: 1px solid rgba(224,82,82,0.3);
    color: var(--danger);
    border-radius: 6px;
    padding: 0.25rem 0.75rem;
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-clear:hover { background: rgba(224,82,82,0.1); }

  .btn-export {
    background: none;
    border: 1px solid rgba(82,192,122,0.3);
    color: var(--success);
    border-radius: 6px;
    padding: 0.25rem 0.75rem;
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-export:hover { background: rgba(82,192,122,0.1); }

  .history-empty {
    padding: 2rem;
    text-align: center;
    color: var(--chalk-muted);
    font-size: 0.85rem;
  }

  .history-list { max-height: 280px; overflow-y: auto; }

  .history-row {
    display: grid;
    grid-template-columns: 2rem 1fr 1fr 1fr 1.5fr;
    align-items: center;
    padding: 0.65rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    transition: background 0.1s;
    animation: rowIn 0.3s ease;
  }
  .history-row:hover { background: rgba(255,255,255,0.03); }
  .history-row:last-child { border-bottom: none; }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .rack-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--chalk-muted);
  }

  .cell { color: var(--chalk); font-family: 'DM Mono', monospace; }

  .score-pill {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .score-high { background: rgba(82,192,122,0.15); color: var(--success); }
  .score-mid  { background: rgba(245,197,24,0.15); color: var(--accent); }
  .score-low  { background: rgba(224,82,82,0.15); color: var(--danger); }

  .col-head {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-muted);
  }

  .history-cols {
    display: grid;
    grid-template-columns: 2rem 1fr 1fr 1fr 1.5fr;
    padding: 0.5rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }

  /* scrollbar */
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>9-Ball Drills</h1>
    <span class="subtitle">Progress Tracker</span>
  </header>

  <div class="layout">
    <!-- Entry Form -->
    <div class="card">
      <div class="card-title">Log a Rack</div>

      <div class="field">
        <label>Balls pocketed on break</label>
        <div class="number-input">
          <button onclick="adj('break',-1)">−</button>
          <input type="number" id="inp-break" value="0" min="0" max="9" oninput="updatePreview()">
          <button onclick="adj('break',1)">+</button>
        </div>
      </div>

      <div class="field">
        <label>Misses</label>
        <div class="number-input">
          <button onclick="adj('misses',-1)">−</button>
          <input type="number" id="inp-misses" value="0" min="0" max="9" oninput="updatePreview()">
          <button onclick="adj('misses',1)">+</button>
        </div>
      </div>

      <div class="score-preview">
        <div>
          <div class="label">Score</div>
          <div class="value invalid" id="score-display">—</div>
        </div>
        <div style="text-align:right">
          <div class="label">Clearance</div>
          <div style="font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--chalk-muted)" id="clearance-display">—</div>
        </div>
      </div>

      <button class="btn-add" id="btn-log" onclick="logRack()">Log Rack</button>
    </div>

    <!-- Right column -->
    <div class="right-col">
      <!-- Stats -->
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">Racks</div>
          <div class="stat-value highlight" id="stat-racks">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Score</div>
          <div class="stat-value" id="stat-avg">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best</div>
          <div class="stat-value" id="stat-best">—</div>
        </div>
      </div>

      <!-- Chart -->
      <div class="chart-card">
        <div class="card-title">Score over time</div>
        <div class="chart-wrap">
          <canvas id="scoreChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- History -->
  <div style="margin-top:1.5rem">
    <div class="history-card">
      <div class="history-header">
        <div class="card-title" style="margin:0">Rack History</div>
        <div style="display:flex;gap:0.5rem">
          <button class="btn-export" onclick="exportCSV()">Export CSV</button>
          <button class="btn-clear" onclick="clearHistory()">Clear All</button>
        </div>
      </div>
      <div class="history-cols">
        <span class="col-head">#</span>
        <span class="col-head">Break</span>
        <span class="col-head">Misses</span>
        <span class="col-head">Left</span>
        <span class="col-head">Score</span>
      </div>
      <div id="history-empty" class="history-empty">No racks logged yet. Log your first rack!</div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'pool-drill-tracker-v1';
  let racks = [];
  let chart = null;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) racks = JSON.parse(raw);
    } catch(e) { racks = []; }
    render();
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(racks));
  }

  function adj(field, delta) {
    const id = field === 'break' ? 'inp-break' : 'inp-misses';
    const el = document.getElementById(id);
    const v = Math.max(0, Math.min(9, (parseInt(el.value) || 0) + delta));
    el.value = v;
    updatePreview();
  }

  function calcScore(brk, misses) {
    const left = 9 - brk;
    if (left <= 0) return null;
    if (misses > left) return null;
    return Math.round(100 * (left - misses) / left);
  }

  function updatePreview() {
    const brk = parseInt(document.getElementById('inp-break').value) || 0;
    const misses = parseInt(document.getElementById('inp-misses').value) || 0;
    const left = 9 - brk;
    const score = calcScore(brk, misses);
    const scoreEl = document.getElementById('score-display');
    const clearEl = document.getElementById('clearance-display');
    const btn = document.getElementById('btn-log');

    if (score === null) {
      scoreEl.textContent = '—';
      scoreEl.className = 'value invalid';
      clearEl.textContent = '—';
      btn.disabled = true;
    } else {
      scoreEl.textContent = score;
      scoreEl.className = 'value';
      clearEl.textContent = `${left - misses} / ${left} balls`;
      btn.disabled = false;
    }
  }

  function logRack() {
    const brk = parseInt(document.getElementById('inp-break').value) || 0;
    const misses = parseInt(document.getElementById('inp-misses').value) || 0;
    const score = calcScore(brk, misses);
    if (score === null) return;

    racks.push({ brk, misses, score, ts: Date.now() });
    save();

    // reset
    document.getElementById('inp-break').value = 0;
    document.getElementById('inp-misses').value = 0;
    updatePreview();
    render();
  }

  function exportCSV() {
    if (!racks.length) return;
    const rows = [['Rack','Break Balls','Misses','Balls Left','Score','Date']];
    racks.forEach((r, i) => {
      const left = 9 - r.brk;
      const date = new Date(r.ts).toLocaleDateString();
      rows.push([i + 1, r.brk, r.misses, left - r.misses, r.score, date]);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '9ball-drills.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function clearHistory() {
    if (!racks.length) return;
    if (!confirm('Clear all rack history?')) return;
    racks = [];
    save();
    render();
  }

  function scoreClass(s) {
    if (s >= 80) return 'score-high';
    if (s >= 50) return 'score-mid';
    return 'score-low';
  }

  function render() {
    // Stats
    document.getElementById('stat-racks').textContent = racks.length;
    if (racks.length) {
      const avg = Math.round(racks.reduce((a,r) => a + r.score, 0) / racks.length);
      const best = Math.max(...racks.map(r => r.score));
      document.getElementById('stat-avg').textContent = avg;
      document.getElementById('stat-best').textContent = best;
    } else {
      document.getElementById('stat-avg').textContent = '—';
      document.getElementById('stat-best').textContent = '—';
    }

    // History
    const emptyEl = document.getElementById('history-empty');
    const listEl = document.getElementById('history-list');
    if (!racks.length) {
      emptyEl.style.display = '';
      listEl.innerHTML = '';
    } else {
      emptyEl.style.display = 'none';
      listEl.innerHTML = [...racks].reverse().map((r, i) => {
        const num = racks.length - i;
        const left = 9 - r.brk;
        return `<div class="history-row">
          <span class="rack-num">${num}</span>
          <span class="cell">${r.brk}</span>
          <span class="cell">${r.misses}</span>
          <span class="cell">${left - r.misses}/${left}</span>
          <span><span class="score-pill ${scoreClass(r.score)}">${r.score}</span></span>
        </div>`;
      }).join('');
    }

    // Chart
    renderChart();
  }

  function renderChart() {
    const ctx = document.getElementById('scoreChart').getContext('2d');
    const labels = racks.map((_, i) => i + 1);
    const data = racks.map(r => r.score);

    // rolling average (window 5)
    const rolling = data.map((_, i) => {
      const window = data.slice(Math.max(0, i - 4), i + 1);
      return Math.round(window.reduce((a, b) => a + b, 0) / window.length);
    });

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.data.datasets[1].data = rolling;
      chart.update('none');
      return;
    }

    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Score',
            data,
            borderColor: 'rgba(245,197,24,0.5)',
            backgroundColor: 'rgba(245,197,24,0.08)',
            pointBackgroundColor: 'rgba(245,197,24,0.9)',
            pointRadius: 4,
            pointHoverRadius: 6,
            borderWidth: 1.5,
            fill: true,
            tension: 0.3,
          },
          {
            label: 'Avg (5)',
            data: rolling,
            borderColor: 'rgba(82,192,122,0.8)',
            backgroundColor: 'transparent',
            pointRadius: 0,
            borderWidth: 2,
            tension: 0.4,
            fill: false,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            labels: {
              color: 'rgba(184,180,158,0.8)',
              font: { family: 'DM Mono', size: 10 },
              boxWidth: 16,
              padding: 12,
            }
          },
          tooltip: {
            backgroundColor: 'rgba(15,31,23,0.95)',
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 1,
            titleColor: '#e8e4d4',
            bodyColor: '#b8b49e',
            titleFont: { family: 'DM Mono', size: 11 },
            bodyFont: { family: 'DM Mono', size: 11 },
          }
        },
        scales: {
          x: {
            ticks: { color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 } },
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { color: 'rgba(255,255,255,0.1)' },
            title: { display: true, text: 'Rack #', color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 } }
          },
          y: {
            min: 0,
            max: 100,
            ticks: { color: 'rgba(184,180,158,0.5)', font: { family: 'DM Mono', size: 10 }, stepSize: 25 },
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { color: 'rgba(255,255,255,0.1)' },
          }
        }
      }
    });
  }

  load();
  updatePreview();
</script>
</body>
</html>
